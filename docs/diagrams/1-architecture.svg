<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40" y="46" class="t">1 · Architecture: how the pieces fit</text>
<text x="40" y="72" class="st">Two packages: core/ extracts actions from an email, and evaluator/ scores any extractor against a golden dataset.</text>

<rect x="80" y="100" width="220" height="54" rx="10" class="ent"/>
<text x="190" y="123" class="h" text-anchor="middle">main.py</text>
<text x="190" y="143" class="s" text-anchor="middle">demo on one sample email</text>
<rect x="470" y="100" width="260" height="54" rx="10" class="ent"/>
<text x="600" y="123" class="h" text-anchor="middle">tests/test_eval_live.py</text>
<text x="600" y="143" class="s" text-anchor="middle">pytest -m eval: the full eval run</text>
<rect x="900" y="100" width="250" height="54" rx="10" class="ent"/>
<text x="1025" y="123" class="h" text-anchor="middle">tests/test_*.py</text>
<text x="1025" y="143" class="s" text-anchor="middle">89 unit tests, no network</text>

